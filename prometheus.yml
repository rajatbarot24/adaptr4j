global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: service-a
    static_configs:
      - targets: ['localhost:8080']
    metrics_path: /actuator/prometheus

  - job_name: service-b
    static_configs:
      - targets: ['localhost:8081']
    metrics_path: /actuator/prometheus

  - job_name: service-c
    static_configs:
      - targets: ['localhost:8083']
    metrics_path: /actuator/prometheus

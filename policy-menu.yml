# AdaptR4j policy menu — 30 named Resilience4j configurations.
#
# Generated to cover the Pareto front across three fault regimes:
#   LOW:    stable network, low error, low latency
#   MEDIUM: moderate failures, ~500ms upstream latency
#   HIGH:   cascade risk — tight CB, low retry amplification, small bulkhead
#
# Used as the bandit's discrete action space (n_actions = 30).
# Regenerate via:  python bayesian_opt.py --n-calls 120 --out policy-menu.yml

policies:

  # ── Tier 1: Balanced fallback (P10 — default static baseline) ──────────────
  - id: p01
    name: balanced-fallback
    cb:
      sliding_window_size: 50
      failure_rate_threshold: 0.50
      slow_call_rate_threshold: 1.00
      slow_call_duration_ms: 1000
      wait_duration_in_open_state_ms: 10000
      permitted_calls_in_half_open_state: 5
      minimum_number_of_calls: 10
    retry:
      max_attempts: 3
      wait_duration_ms: 500
      exponential_backoff: false
      exponential_multiplier: 2.0
    bulkhead:
      max_concurrent_calls: 40
      max_wait_duration_ms: 0


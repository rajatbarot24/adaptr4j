# Safe policy menu (v3, Nov 2026): policies from policy-menu.yml whose circuit breaker
# tolerates >=45% failures and whose slow-call duration exceeds the 500 ms latency SLO.
# Stricter breakers treated SLO-compliant calls or ordinary error bursts as failures and
# rejected almost all traffic under faults (see analysis/sweep_table.py).
policies:
- id: p01
  name: balanced-fallback
  cb:
    sliding_window_size: 50
    failure_rate_threshold: 0.5
    slow_call_rate_threshold: 1.0
    slow_call_duration_ms: 1000
    wait_duration_in_open_state_ms: 10000
    permitted_calls_in_half_open_state: 5
    minimum_number_of_calls: 10
  retry:
    max_attempts: 3
    wait_duration_ms: 500
    exponential_backoff: false
    exponential_multiplier: 2.0
  bulkhead:
    max_concurrent_calls: 40
    max_wait_duration_ms: 0
